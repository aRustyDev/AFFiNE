# Scratch stack for woven-restore.sh — an ISOLATED throwaway AFFiNE instance used
# to rehearse restoring a woven-backup. Driven entirely by env (see the script):
# no container_name (would collide with the live 'affine' stack), no published
# ports except the server, indexer disabled (Manticore skipped) to stay light.
# Project name is supplied via `docker compose -p <project>`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE:-affine}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-U',
          '${DB_USERNAME}',
          '-d',
          '${DB_DATABASE:-affine}',
        ]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 3s
      timeout: 5s
      retries: 20

  affine_migration:
    image: ${AFFINE_IMAGE:-ghcr.io/toeverything/affine:stable}
    command: ['sh', '-c', 'node ./scripts/self-host-predeploy.js']
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  affine:
    image: ${AFFINE_IMAGE:-ghcr.io/toeverything/affine:stable}
    ports:
      - '${RESTORE_PORT:-3011}:3010'
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE:-affine}
      - AFFINE_INDEXER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
