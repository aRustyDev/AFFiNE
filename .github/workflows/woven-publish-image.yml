name: woven-publish-image

# Fork-local (woven-* namespaced), rebase-safe: does NOT edit upstream
# build-images.yml / release.yml. Builds the community self-host server image from
# scripts/woven.Dockerfile (single monolithic from-source build; NO proprietary
# R2/Sentry/Perfsee/Captcha/AFFINE_PRO secrets) and pushes it to
# ghcr.io/${owner}/affine. See .claude/plans/ghcr-image-publishing/PLAN.md
# (beads epic affine-3ab; A0 spike affine-3ab.1 closed).
#
# Publishes on push to woven/main (docs-only pushes ignored via paths-ignore) and on
# manual workflow_dispatch. Immutable tag :woven-<short-sha> (the cluster pins this)
# plus the moving :woven. The GHCR package must be set PUBLIC once (the first push is
# private); the ds-cleaner cluster then pulls anonymously (infra epic infra-bt6g).

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built image to GHCR'
        type: boolean
        default: true
  push:
    branches:
      - woven/main
    paths-ignore:
      - '.claude/**'
      - '**/*.md'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build self-host image (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute image ref
        id: ref
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}" # GHCR requires a lowercase owner
          sha="$(git rev-parse --short HEAD)"
          {
            echo "owner=$owner"
            echo "sha=$sha"
            echo "image=ghcr.io/$owner/affine"
          } >> "$GITHUB_OUTPUT"

      - name: Reclaim runner disk (heavy monolithic build)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          df -h /

      # Build context is filtered by the committed root .dockerignore (keeps the
      # tests/*, blocksuite/**, packages/*, tools/* workspaces yarn --immutable
      # needs; drops node_modules/.git/target). Do not reintroduce a fork-local
      # ignore file here: scripts/woven.dockerignore excluded tests/ and dropped 8
      # workspace package.json (-> yarn --immutable YN0028). It was fixed for CI in
      # 4384cd820c and deleted outright on 2026-08-31 (bead affine-4aj).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.push == true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build self-host server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/woven.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.push == true }}
          provenance: false
          build-args: |
            BUILD_TYPE=stable
            APP_VERSION=woven-${{ steps.ref.outputs.sha }}
          tags: |
            ${{ steps.ref.outputs.image }}:woven-${{ steps.ref.outputs.sha }}
            ${{ steps.ref.outputs.image }}:woven
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=woven-${{ steps.ref.outputs.sha }}
